# Runs the project's existing automated test suite on every push and every pull request.
#
# Safe by construction: no secret, token or key is read (no `secrets.*`), the job has read-only repository access, and the tests are offline (synthetic data, stand-in models, local sockets only).
# No live call, no Twilio, no OpenAI and no Anthropic request is made. The test suite itself refuses live paths. Node 24 is what `poc/intake-runner/package.json` requires ("engines": ">=24").
#
# The suite's output is kept for the run page without needing a GitHub sign-in: the counts and the names of failing tests go to the job summary, and each failing test becomes an annotation
# carrying the first lines of its own failure message. (The raw log needs a sign-in even for a public repository.) The output holds synthetic test data only.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poc/intake-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: poc/intake-runner/package-lock.json
      - name: Install the locked dependencies (no keys involved)
        run: npm ci
      - name: Full test suite
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/test-output.txt"
          npm test > "$out" 2>&1
          code=$?
          {
            echo "## Test summary (exit code $code)"
            grep -E '^ℹ (tests|pass|fail|cancelled|skipped|todo)' "$out"
            echo
            echo "### Failing tests (first 40)"
            grep -E '^✖' "$out" | sort -u | head -40
          } >> "$GITHUB_STEP_SUMMARY"
          # One annotation per failing test (up to 8) with the first lines of its own failure message: the runner prints them in its closing "failing tests" section.
          # (Only on a failing run, and never for a test marked todo: the two known masker gaps are reported by the runner as todo, not as failures.)
          if [ "$code" != "0" ]; then
            node -e '
              const s = require("fs").readFileSync(process.argv[1], "utf8");
              const i = s.indexOf("✖ failing tests:");
              if (i < 0) process.exit(0);
              const blocks = s.slice(i).split("\ntest at ").slice(1).filter((b) => !/\)\s+# /.test(b.split("\n").slice(0, 3).join(" "))).slice(0, 8);
              for (const b of blocks) {
                const lines = b.split("\n").map((l) => l.trimEnd().slice(0, 240)).filter((l) => l.trim() !== "").slice(0, 9);
                console.log("::error::" + lines.join("%0A"));
              }
            ' "$out"
          fi
          exit $code
